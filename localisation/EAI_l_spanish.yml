 EAI_config_ARMY_window_desc_DIPLOMATIC:0 "§YSu alto mando informa que la producción militar actual de [?EAI_configuration_target.GetName] es la siguiente.§!"
 EAI_config_ARMY_window_desc_GLOBAL:0 "§YAgrega los países que deseas modificar a la lista de países. No se pueden agregar países que estén siendo configurados por la IA.§!"

