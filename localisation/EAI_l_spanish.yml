 EAI_config_DIFFICULTY_5_headline:0 "Convoyes gratuitos de la IA"
 EAI_config_DIFFICULTY_5_tt:0 "Los países controlados por la IA reciben convoyes gratuitos mensualmente siempre que tengan menos de 50 convoyes disponibles."

 EAI_config_DIFFICULTY_6_headline:0 "Aumento de la planificación/fortificación"
 EAI_config_DIFFICULTY_6_tt:0 "+100% de velocidad de planificación y fortificación (dinámico)."



 EAI_config_GENERAL_1_text:0 "Enfoque militar de la IA"
 EAI_config_GENERAL_1_dropdown_text:0 "Enfoque militar de la IA: [EAI_GetAIFocuses]"
 EAI_config_GENERAL_1_tt:0 "Esto influye en los tipos generales de ejércitos, marinas y aviones que la IA investiga y construye.\n\n§YCambiar esto una vez que el juego haya comenzado tendrá poco efecto. Aún puedes reconfigurar los enfoques de un país a través de la configuración del país.§!"
 EAI_config_GENERAL_1a_text:0 "Normal"
 EAI_config_GENERAL_1a_tt:0 "§YChallenging§!\n\n-You want the AI to play as efficiently as possible.\n-AI uses more meta-oriented builds which may mean you see less tanks used by certain countries for example.\n-AI behavior in certain situations is more competitive-oriented, less immersive.\n-The game may progress less historically than in other modes when it comes to non-major events such as Bessarabia, unhistorical annexation of certain countries for efficiency for example.\n-Certain AI cheats and shortcuts are enabled by default which are required to have the AI play at a level closer to what a player can achieve in a competitive setting.\n\n§YNormal§!\n\n-You want a more immersive game at the cost of efficiency, which may mean the AI needs more bonuses applied.\n-AI uses more diverse builds with variation from game to game even if they are not the most effective strategies. It is less locked into extreme strategies such as mass infantry-only.\n-The game is meant to progress mostly historically without the AI taking shortcuts in favor of efficiency.\n-No AI cheats are enabled by default.\n\n§YHistorical§!\n\n-Major countries in particular are locked into builds that are a little bit more historical, for example building a diverse navy and an air force instead of focusing more on efficiency.\n-Note that this mod does not replicate specific historical divisions or equipment at all.\n\n§YRandom§!\n\n-Similar to normal mode but the AI's builds are randomized."
