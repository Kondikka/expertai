 EAI_DM_AA.10000.t:0 "Advertencia emitida contra [EAI_illegal_wargoal_invader.GetName]"
 EAI_DM_AA.10000.d:0 "La agresión de [EAI_illegal_wargoal_invader.GetNameDef] hacia [EAI_illegal_wargoal_target.GetName] ha provocado una reacción por parte de otros países que temen por su propia seguridad nacional o por la estabilidad de la región. [EAI_illegal_wargoal_invader.GetNameDef] tiene siete días para cesar sus acciones hostiles hacia [EAI_illegal_wargoal_target.GetName].\n\nIgnorar esta advertencia dañará las futuras relaciones diplomáticas y podría llevar a una intervención en apoyo a [EAI_illegal_wargoal_target.GetName]."
 EAI_DM_AA.10000.o1:0 "Entendido."

 EAI_DM_AA.10000.d.tt:0 "§RCancela tu justificación de guerra contra [EAI_illegal_wargoal_target.GetName] en un plazo de 7 días, o los demás países podrían tomar medidas (garantizar, envío de suministros, voluntarios, tener una visión negativa hacia ti) para apoyar a [EAI_illegal_wargoal_target.GetName].§!\n\n"

 EAI_DM_AA.10002.t:0 "Apoya a [EAI_illegal_wargoal_target.GetName]"

 EAI_DM_AA.10004.t:0 "[EAI_illegal_wargoal_invader.GetName] Ignora la advertencia"
 EAI_DM_AA.10004.d:0 "[EAI_illegal_wargoal_invader.GetLeader] ha ignorado la advertencia emitida contra [EAI_illegal_wargoal_invader.GetName]."
 EAI_DM_AA.10004.o1:0 "Entendido."

 EAI_DM_AA.10013.t:0 "[From.GetName] emite una advertencia"
 EAI_DM_AA.10013.d:0 "El líder de [From.GetNameDef], [From.GetLeader], ha emitido la siguiente advertencia a [Root.GetNameDef]: si [Root.GetNameDef] lleva su guerra de agresión a las fronteras de [From.GetNameDef], será considerado una grave amenaza para el pueblo [From.GetAdjective], dejando a [From.GetNameDef] sin otra opción que buscar aliados."
 EAI_DM_AA.10013.o1:0 "Entendido."

 EAI_DM_AA.10011.t:0 "[EAI_illegal_wargoal_invader.GetName] se echa atrás"
 EAI_DM_AA.10011.d:0 "[EAI_illegal_wargoal_invader.GetNameDef] ha acordado cesar sus actos hostiles hacia [EAI_illegal_wargoal_target.GetName]."
 EAI_DM_AA.10011.o1:0 "Prevalece la paz."

 EAI_DM_AA.10012.t:0 "[EAI_illegal_wargoal_invader.GetName] Ignora la advertencia"
 EAI_DM_AA.10012.d:0 "[EAI_illegal_wargoal_invader.GetLeader] ha ignorado la advertencia emitida contra [EAI_illegal_wargoal_invader.GetName]."
 EAI_DM_AA.10012.o1:0 "Entendido."

 EAI_DM_AA.10010.o1:0 "Entendido."

 EAI_DM.58.t:0 "África Oriental Italiana"
 EAI_DM.58.d:0 "Nuestros líderes en Roma proponen que establezcamos una nueva colonia en África Oriental Italiana mediante la fusión de nuestras tres posesiones en el Cuerno de África: Eritrea italiana, Etiopía italiana y Somalia italiana, y designen al héroe de guerra de la guerra etíope, Pietro Badoglio, como su Virrey."
 EAI_DM.58.o1:0 "Redactar la constitución."
 EAI_DM.58.o2:0 "Mantenerla bajo nuestra estricta administración."

 EAI_DM.1000.t:0 "Expert AI"
 EAI_DM.1000.d:0 "[From.GetName] está justificando un objetivo de guerra contra [Root.GetName] (25 días)."

 EAI.4.t:0 "Expert AI"
 EAI.4.d:0 "El jugador que controla [From.GetNameDef] ha abierto el evento de configuración de Expert AI."

 EAI.3.t:0 "Expert AI"
 EAI.3.d:0 "Esto parece ser un juego multijugador. Solo un jugador puede configurar los ajustes de inicio. Sin embargo, puedes elegir si permitir que todos abran la ventana de configuración avanzada más adelante en el juego o limitarla solo a ti. Cada vez que se abra la ventana de configuración, todos los jugadores del juego recibirán una notificación.\n\n¿Deseas configurar los ajustes de inicio de Expert AI en esta sesión?"
 EAI.3.o3:0 "Sí, y solo yo puedo abrir la ventana de configuración durante este juego."
 EAI.3.o1:0 "Sí, pero se permite a todos abrir la ventana de configuración más adelante."
 EAI.3.o2:0 "No, deja que alguien más configure el mod."

 EAI_operation_countenance:0 "Operación Conciencia"
 EAI_operation_countenance_desc:0 "Nos estamos preparando para un ataque sorpresa a Irán."
 EAI_propose_operation_countenance:0 "Proponer Operación Conciencia"
 EAI_propose_operation_countenance_desc:0 "Proponer una invasión conjunta anglo-soviética a Irán para asegurar su petróleo y una ruta de suministro segura hacia la Unión Soviética."
 EAI_DM.1300_t:0 "Operación Conciencia"
 EAI_DM.1300_d:0 "Hemos recibido una propuesta de [From.GetNameDef] para lanzar una invasión conjunta a Irán. Dicen que debemos asegurar sus campos petrolíferos del enemigo y establecer una ruta de suministro segura hacia la Unión Soviética."
 EAI_DM.1300.o1:0 "Estamos de acuerdo."
 EAI_DM.1300.o2:0 "Rechazamos la propuesta."
 EAI_DM.1300.tt:0 "Lanzaremos un ataque sorpresa en 35 días."
 EAI_DM.1301_t:0 "Invasión anglo-soviética de Irán"
 EAI_DM.1301_d:0 "[SOV.GetNameDefCap] y [ENG.GetNameDef] han lanzado una invasión conjunta a Irán. Citan preocupaciones estratégicas sobre la región como su justificación."
 EAI_DM.1301.o1:0 "Interesante..."
 EAI_DM.1302_t:0 "Operación Conciencia"
 EAI_DM.1302_d:0 "[From.GetNameDefCap] se ha negado a llevar a cabo una invasión conjunta a Irán."
 EAI_DM.1302.o1:0 "Malditos."
 EAI_DM.1303_t:0 "Operación Conciencia"
 EAI_DM.1303_d:0 "[From.GetNameDefCap] ha aceptado ayudarnos en una invasión conjunta a Irán."
 EAI_DM.1303.o1:0 "Bien."

 EAI_DM.24.t:0 "Operación Barbarroja"
 EAI_DM.24.d:0 "La derrota de Finlandia en la Guerra de Invierno contra la Unión Soviética los ha dejado tambaleándose. La Unión Soviética continúa presionándolos con más demandas.\n\nTenemos la oportunidad de contactar discretamente al círculo interno del gobierno finlandés y pedirles que se unan a nuestra próxima guerra contra la Unión Soviética."
 EAI_DM.24.o1:0 "Contactar al liderazgo finlandés"
 EAI_DM.24.o2:0 "No los necesitamos."

 EAI_DM.25.t:0 "Operación Barbarroja"
 EAI_DM.25.d:0 "El gobierno alemán ha contactado a nuestro liderazgo en secreto. Planean invadir la Unión Soviética y nos han invitado a unirnos."
 EAI_DM.25.o1:0 "Aceptar"
 EAI_DM.25.o2:0 "Rechazar"

 EAI_DM.26.t:0 "Operación Barbarroja"
 EAI_DM.26.d:0 "El gobierno finlandés ha aceptado unirse a nuestra guerra."
 EAI_DM.26.o1:0 "Entiendo."

 EAI_DM.27.t:0 "Operación Barbarroja"
 EAI_DM.27.d:0 "El gobierno finlandés ha rechazado unirse a nuestra guerra."