 EAI_config_DIFFICULTY_1d_tt:0 "§YBonificación: Insano§!\n\n§LPresiona el botón de personalizar para ver los modificadores exactos.§!"

 EAI_config_DIFFICULTY_2_headline:0 "Defensa desesperada dinámica"
 EAI_config_DIFFICULTY_2_tt:0 "Los países de la IA que están en guerra con un jugador obtienen bonificaciones crecientes en la industria y el tiempo de reclutamiento a medida que se acercan a la capitulación.\n\n§RPuedes desactivar o anular esta configuración para países específicos a través de la configuración del país.§!"
 EAI_config_DIFFICULTY_2a_text:0 "Desactivada"
 EAI_config_DIFFICULTY_2b_text:0 "Baja"
 EAI_config_DIFFICULTY_2b_tt:0 "§YDefensa desesperada: Baja\n\nBonificaciones de Defensa desesperada en el mínimo (progreso de rendición > 0%):§!\n\n§L-Tiempo de reclutamiento de divisiones: -60%\n-Producción de astilleros: +5%\n-Crecimiento de eficiencia de producción: +10%\n\nAdemás, cualquier equipo terrestre y aéreo del que este país tenga escasez tiene una reducción de costos baja.§!"
 EAI_config_DIFFICULTY_2c_text:0 "Media"
