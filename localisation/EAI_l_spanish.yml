  EAI_config_ARMY_L5_text:0 "Adjunto"
 EAI_config_ARMY_L5_tt:0 "§LEl adjunto es un tipo de división que este país construye en menor medida en comparación con los roles principales, como divisiones de infantería, blindaje y antitanque.\n\nSi este país tiene enfoque militar antitanque, el tipo de divisiones antitanque que produce depende de esta elección.\n\nCon un adjunto de blindado medio o pesado, este país utiliza destructores de tanques medianos o pesados en sus divisiones antitanque, respectivamente.\n\nCon un adjunto motorizado o de blindado ligero, se utilizarán brigadas antitanque de línea regular.§!"
