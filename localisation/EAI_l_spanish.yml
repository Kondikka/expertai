  EAI_config_global_mode_text:0 "Modo Global"
 EAI_config_global_mode_tt:0 "Activa el modo de configuración global.\n\nAgrega los países que deseas modificar a la lista de países. Los ajustes de dificultad que elijas aquí mientras el modo global está activado se aplicarán a todos los países de la lista de países.\n\n§RCambios realizados antes de agregar países a la lista no se aplicarán de forma global.§!"

 EAI_config_custom_bonus_text:0 "Personalizar"
 EAI_config_custom_bonus_tt:0 "Personaliza los modificadores de bonificación de dificultad. 0.01 significa un cambio del 1% para la mayoría de los modificadores.\n\n§R-------------- ¡ADVERTENCIA! --------------§!\n\n§YCiertos modificadores romperán el país si alcanzan el -100% en total (incluyendo modificadores añadidos desde otros lugares del juego), como: suministro, consumo de combustible, tiempo de entrenamiento.\n\nMantente entre -50% y 0% en modificadores de los que no estés seguro.§!"
 EAI_config_custom_bonus_eq_modifier_text:0 "Reducción Dinámica de Costos de Equipamiento"
 EAI_config_CUSTOM_BONUS_25_tt:0 "Equipment with low stockpiles have reduced costs.\n\n-15/-30/-45% reduction based on level. -5/-10/-15% for aircraft."
